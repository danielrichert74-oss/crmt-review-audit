name: Greenville pilot - Stophy reviews

on:
  workflow_dispatch:
    inputs:
      place_id:
        description: "Verified Google Maps Place ID for the Greenville, TX dealership"
        required: true
        type: string
      listing_url:
        description: "Google Maps listing URL reached from the official dealership page"
        required: true
        type: string
      max_pages:
        description: "Maximum pages to fetch (start with 1; each successful page may use a free credit)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Collect reviews
        env:
          STOPHY_PLACE_ID: ${{ inputs.place_id }}
          STOPHY_LISTING_URL: ${{ inputs.listing_url }}
          STOPHY_MAX_PAGES: ${{ inputs.max_pages }}
          STOPHY_API_KEY: ${{ secrets.STOPHY_API_KEY }}
        run: python src/collect_reviews.py
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenville-tx-review-audit
          path: output/
          if-no-files-found: warn
          retention-days: 30
