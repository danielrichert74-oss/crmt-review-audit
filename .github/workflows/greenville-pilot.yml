name: Greenville pilot - Stophy reviews
on:
  workflow_dispatch:
  push:
    paths:
      - "data/run-pilot.txt"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Resolve exact Greenville listing and collect one page
        env:
          STOPHY_QUERY: "America's Car-Mart"
          STOPHY_LOCATION: "Greenville, TX"
          STOPHY_EXPECTED_NAME: "CAR-MART of Greenville"
          STOPHY_EXPECTED_ADDRESS: "5107 Interstate Highway 30, Greenville, TX 75402"
          STOPHY_EXPECTED_PHONE: "903-458-9900"
          STOPHY_MAX_PAGES: "1"
          STOPHY_API_KEY: ${{ secrets.STOPHY_API_KEY }}
        run: python src/collect_reviews.py
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenville-tx-review-audit
          path: output/
          if-no-files-found: warn
          retention-days: 30
