name: Greenville pilot - gosom Google Maps scraper
on:
  workflow_dispatch:
  push:
    paths:
      - "data/run-gosom-pilot.txt"
      - "src/process_gosom_output.py"
      - ".github/workflows/greenville-gosom-pilot.yml"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare exact official Google Maps listing URL
        run: |
          mkdir -p .tmp output
          python src/process_gosom_output.py --prepare-input .tmp/greenville-url.txt
          echo "Prepared exact input URL:"
          cat .tmp/greenville-url.txt
      - name: Run pinned open-source scraper
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          docker pull gosom/google-maps-scraper:v1.18.1
          docker run --rm \
            -e DISABLE_TELEMETRY=1 \
            -v "${GITHUB_WORKSPACE}:/work" \
            gosom/google-maps-scraper:v1.18.1 \
            -input /work/.tmp/greenville-url.txt \
            -results /work/output/raw-scraper-output.jsonl \
            -json \
            -extra-reviews \
            -depth 1 \
            -c 1 \
            -exit-on-inactivity 3m
      - name: Keep only verified Greenville one-star reviews
        run: python src/process_gosom_output.py --raw output/raw-scraper-output.jsonl --output-dir output
      - name: Remove unfiltered scraper output
        if: always()
        run: rm -f output/raw-scraper-output.jsonl
      - name: Upload filtered audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenville-tx-gosom-one-star-audit
          path: output/
          if-no-files-found: warn
          retention-days: 30
